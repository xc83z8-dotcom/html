<!DOCTYPE html>
<html>

<head>
    <title>Task 3</title>
    <style>
        table {
            width: 410px;
        }

        th,
        td {
            text-align: center;
        }

        img {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <h1>This is Task (3)</h1>

    <h2>Images In Tables</h2>

    <hr>

    <h3>What are your favourite pets?</h3>

    <table border="1">
        <tr>
            <th>Pet Image</th>
            <th>More Facts about (as a link)</th>
        </tr>

        <tr>
            <td>
                <img src="horse.jpeg" alt="Horse">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Horse">
                    Horse
                </a>
            </td>
        </tr>

        <tr>
            <td>
                <img src="dog.jpeg" alt="Dog">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Dog">
                    Dogs
                </a>
            </td>
        </tr>

        <tr>
            <td>
                <img src="cat.jpeg" alt="Cat">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Cat">
                    Cats
                </a>
            </td>
        </tr>
    </table>

</body>

</html>
